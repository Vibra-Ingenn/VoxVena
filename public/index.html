<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vox Vena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="shell">
    <header class="hero">
      <p class="brand">Vox Vena</p>
      <h1>Make it sound like a conversation.</h1>
      <p class="lede">Paste ChatGPT text. Light kills manual/blueprint voice — Big-O jargon, section labels, code-block layout — so it reads like talking to someone, not a rocket schematic. Leave LLM off.</p>
    </header>

    <section class="controls">
      <label class="field">
        <span>Intensity</span>
        <select id="intensity">
          <option value="light" selected>Light — strip AI + tech-plan voice (recommended)</option>
          <option value="medium">Medium — + structure cleanup</option>
          <option value="heavy">Heavy — optional LLM roughen (can polish wrong)</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" id="use_llm" />
        <span>LLM roughen (off = safer; ignored on Light)</span>
      </label>
      <button type="button" id="run_btn" class="primary">Humanize</button>
    </section>

    <section class="panes">
      <label class="pane">
        <span class="pane_label">AI input</span>
        <textarea id="input" spellcheck="true" placeholder="Paste AI-generated text here…"></textarea>
      </label>
      <label class="pane">
        <span class="pane_label">
          Humanized output
          <button type="button" id="copy_btn" class="ghost">Copy</button>
        </span>
        <textarea id="output" spellcheck="true" placeholder="Result shows up here…"></textarea>
      </label>
    </section>

    <footer class="status" id="status" aria-live="polite">Ready.</footer>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
