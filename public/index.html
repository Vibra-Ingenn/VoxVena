<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vox Vena</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="shell">
    <header class="hero">
      <p class="brand">Vox Vena</p>
      <h1>Make it sound like you said it.</h1>
      <p class="lede">Paste something your AI helped you write. Vox Vena takes out the chatbot habits and the stiff wording, and keeps what you meant. It runs on this PC. The AI box is optional; leave it off if the text already sounds like you.</p>
    </header>

    <section class="controls">
      <label class="field">
        <span>Intensity</span>
        <select id="intensity">
          <option value="light" selected>Light — swap AI phrases and chatbot habits, keep the layout</option>
          <option value="medium">Medium — + drop headings, turn lists into sentences</option>
          <option value="heavy">Heavy — + cut warm-up and wrap-up lines</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" id="use_llm" />
        <span>Also rewrite with my AI (Medium and Heavy only)</span>
      </label>
      <button type="button" id="run_btn" class="primary">Humanize</button>
    </section>

    <section class="panes">
      <label class="pane">
        <span class="pane_label">AI input</span>
        <textarea id="input" spellcheck="true" placeholder="Paste AI-generated text here…"></textarea>
      </label>
      <label class="pane">
        <span class="pane_label">
          Humanized output
          <button type="button" id="copy_btn" class="ghost">Copy</button>
        </span>
        <textarea id="output" spellcheck="true" placeholder="Result shows up here…"></textarea>
      </label>
    </section>

    <footer class="status" id="status" aria-live="polite">Ready.</footer>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
